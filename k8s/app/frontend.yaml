apiVersion: v1
kind: Service
metadata:
  name: alimi-frontend
  namespace: alimi
spec:
  # 사용자가 닿는 유일한 입구다. API 는 이제 ClusterIP 로 내부에만 열려 있고,
  # 브라우저 요청은 nginx 가 /api/ 를 alimi-api 로 프록시한다.
  # → 같은 오리진이 되므로 CORS 설정이 통째로 필요 없다.
  type: NodePort
  selector:
    app: alimi
    role: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      # kind-cluster.yaml 의 extraPortMappings 와 짝 → 호스트 localhost:8080
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alimi-frontend
  namespace: alimi
  labels: { app: alimi, role: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: alimi, role: frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: alimi, role: frontend }
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: nginx
          # 정적 파일 + nginx 뿐이다. Node 런타임은 이미지에 없다 —
          # Vite 빌드는 Dockerfile 의 frontend-build 스테이지에서 끝났다.
          image: alimi-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # /healthz 는 nginx 가 직접 응답한다. 백엔드가 죽어도 프론트는 Ready 여야
          # "서비스 점검 중" 같은 화면이라도 띄울 수 있다.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests:
              memory: 32Mi
              cpu: 20m
            limits:
              memory: 128Mi
