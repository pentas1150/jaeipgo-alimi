# 실제로 겪은 문제를 막기 위한 것이다.
#
# KEDA 가 checker 를 12개까지 늘리자 노드 메모리가 97% 로 차버렸고,
# 그 뒤 scheduler 파드가 재시작되면서 스케줄될 자리를 못 찾아 Pending 에 빠졌다.
# 즉 **워커가 자기에게 일을 주는 스케줄러를 굶겨 죽였다.**
# 스케줄러가 멈추면 체크 요청이 아예 발행되지 않으므로 시스템 전체가 정지한다.
#
# 해결: 오토스케일되는 워커를 기본(0)보다 낮은 우선순위로 내린다.
# 그러면 scheduler/api(우선순위 0)가 자리를 필요로 할 때
# 쿠버네티스가 워커를 선점(preempt)해서 자리를 만든다.

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: alimi-worker
# 음수 = 우선순위 없는 기본 파드(0)보다 낮다.
value: -10
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >-
  KEDA 로 오토스케일되는 워커(checker/notifier)용.
  자원이 부족하면 이들이 먼저 밀려나야 한다 — 무한정 늘어날 수 있는 쪽이기 때문이다.

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: alimi-critical
value: 1000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >-
  단일 인스턴스라 대체 불가능한 것들(scheduler)과 상태를 가진 인프라(mysql/kafka)용.
  이들이 밀려나면 시스템 전체가 멈춘다.
