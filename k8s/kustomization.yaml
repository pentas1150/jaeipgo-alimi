apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# KEDA ScaledObject 는 여기에 없다 — CRD 가 먼저 설치돼 있어야 apply 되므로
# `k8s/keda/` 는 KEDA 설치 후 따로 적용한다. (k8s/README.md 참고)

resources:
  - namespace.yaml
  - priorityclass.yaml
  - config.yaml
  - migration-job.yaml
  - infra/mysql.yaml
  - infra/kafka.yaml
  - app/api.yaml
  - app/scheduler.yaml
  - app/checker.yaml
  - app/notifier.yaml
  - app/frontend.yaml

# `commonLabels` 는 selector 까지 건드려서 위험하다(기존 Deployment 의 selector 는 불변 필드).
# kustomize v5 의 `labels` + includeSelectors:false 를 쓴다.
labels:
  - pairs:
      app.kubernetes.io/part-of: jaeipgo-alimi
    includeSelectors: false
