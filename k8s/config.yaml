apiVersion: v1
kind: ConfigMap
metadata:
  name: alimi-config
  namespace: alimi
data:
  # ⚠️ FQDN 을 쓰는 이유가 중요하다.
  # KEDA 는 `keda` 네임스페이스에서 돌면서 이 브로커에 접속해 컨슈머 랙을 읽는다.
  # 짧은 이름 `kafka:9092` 를 쓰면 alimi 네임스페이스 안에서는 되지만 keda 에서는
  # 이름이 안 풀린다. 브로커의 advertised.listeners 도 반드시 같은 FQDN 이어야 한다
  # (클라이언트는 부트스트랩 후 advertised 주소로 재접속하기 때문).
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.alimi.svc.cluster.local:9092"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql.alimi.svc.cluster.local:3306/alimi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&rewriteBatchedStatements=true"
  TZ: "UTC"

# Secret 은 여기 없다.
# kustomization.yaml 의 secretGenerator 가 `secret.env`(git 제외)에서 생성한다.
# 설정 방법은 k8s/README.md "0. 선행 조건" 참고.
