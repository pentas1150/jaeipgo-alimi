apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# KEDA ScaledObject 는 여기에 없다 — CRD 가 먼저 설치돼 있어야 apply 되므로
# `k8s/keda/` 는 KEDA 설치 후 따로 적용한다. (k8s/README.md 참고)

# Secret 은 리포지토리에 두지 않는다.
# `secret.env` 는 .gitignore 되어 있고, secret.env.example 을 복사해 만든다.
#
# 생성되는 이름에는 내용 해시가 붙는다(alimi-secret-abc123...).
# kustomize 가 secretKeyRef / envFrom.secretRef 참조를 알아서 그 이름으로 바꿔주며,
# 값이 바뀌면 이름이 달라져 파드가 자동으로 롤링 재시작된다 — 원하는 동작이다.
secretGenerator:
  - name: alimi-secret
    namespace: alimi
    envs:
      - secret.env
    # 앱보다 먼저 적용돼야 한다 (mysql/migration 이 이 Secret 을 읽는다).
    options:
      labels:
        alimi.stage: infra

resources:
  - namespace.yaml
  - priorityclass.yaml
  - config.yaml
  - migration-job.yaml
  - infra/mysql.yaml
  - infra/kafka.yaml
  - infra/redis.yaml
  - app/api.yaml
  - app/scheduler.yaml
  - app/checker.yaml
  - app/notifier.yaml
  - app/frontend.yaml

# `commonLabels` 는 selector 까지 건드려서 위험하다(기존 Deployment 의 selector 는 불변 필드).
# kustomize v5 의 `labels` + includeSelectors:false 를 쓴다.
labels:
  - pairs:
      app.kubernetes.io/part-of: jaeipgo-alimi
    includeSelectors: false
