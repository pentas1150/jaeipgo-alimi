apiVersion: v1
kind: Service
metadata:
  # 배포 1단계에서 먼저 적용되는 자원 (docs/DESIGN.md §12.10). 앱보다 먼저 준비돼야 한다.
  labels:
    alimi.stage: infra
  name: mysql
  namespace: alimi
spec:
  # StatefulSet 의 안정적인 파드 DNS(mysql-0.mysql...)를 위해 headless 로 둔다.
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  # 배포 1단계에서 먼저 적용되는 자원 (docs/DESIGN.md §12.10). 앱보다 먼저 준비돼야 한다.
  labels:
    alimi.stage: infra
  name: mysql
  namespace: alimi
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      priorityClassName: alimi-critical
      terminationGracePeriodSeconds: 30
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: alimi-secret
          env:
            - name: TZ
              value: UTC
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # MySQL 초기화는 느리다. startup 이 아니라 readiness 로만 잡으면
          # 앱이 먼저 붙었다가 죽는다.
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
