apiVersion: apps/v1
kind: Deployment
metadata:
  name: alimi-notifier
  namespace: alimi
spec:
  # base 는 KEDA 가 관리하라고 replicas 를 비워뒀다.
  # 파이에는 KEDA 를 안 올리므로 여기서 고정한다(비워두면 apply 마다 1로 리셋된다).
  replicas: 1
  template:
    spec:
      containers:
        - name: app
          # 파이4 기준 재조정. 라즈베리파이에서 Spring Boot 기동은 랩탑의 몇 배다.
          #   - startup 예산 150s → 400s (모자라면 CrashLoop 처럼 보이고 배포가 20분 낭비된다)
          #   - httpGet timeout 1s(기본) → 5s. 부하 걸린 노드에서 actuator 가
          #     1초를 넘기면 liveness 가 멀쩡한 파드를 죽인다.
          startupProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 40
          readinessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -Xss512k"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 384Mi
