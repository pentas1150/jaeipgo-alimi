apiVersion: apps/v1
kind: Deployment
metadata:
  name: alimi-notifier
  namespace: alimi
spec:
  # base 는 KEDA 가 관리하라고 replicas 를 비워뒀다.
  # 파이에는 KEDA 를 안 올리므로 여기서 고정한다(비워두면 apply 마다 1로 리셋된다).
  replicas: 1
  template:
    spec:
      containers:
        - name: app
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -Xss512k"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 384Mi
