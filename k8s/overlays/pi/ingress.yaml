apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alimi
  namespace: alimi
spec:
  # k3s 가 기본으로 띄우는 Traefik 을 그대로 쓴다.
  # (kind 환경의 NodePort 30080 은 base 에 남아 있고, 이 오버레이에서만 ClusterIP 로 바뀐다)
  ingressClassName: traefik
  rules:
    # host 를 지정하지 않는다 = 아무 Host 헤더나 받는다.
    # 집 안에서 http://<pi-ip>/ 로 바로 접근하기 위한 catch-all 이다.
    # 도메인을 붙이게 되면 여기에 host 를 추가하면 된다.
    - http:
        paths:
          # 규칙이 하나뿐인 이유: nginx(alimi-frontend)가 이미 /api/ 를
          # alimi-api 로 프록시한다. 같은 오리진을 유지해야 CORS 설정이 계속 불필요하다.
          # Ingress 에서 /api 를 따로 갈라내면 그 이점이 사라진다.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alimi-frontend
                port:
                  number: 8080
