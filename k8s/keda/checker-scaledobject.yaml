# 컨슈머 랙을 보고 Playwright 워커를 늘렸다 줄인다.
# KEDA 가 설치된 뒤에 apply 할 것 (CRD 가 먼저 있어야 한다).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: alimi-checker
  namespace: alimi
spec:
  scaleTargetRef:
    name: alimi-checker

  # pollingInterval / cooldownPeriod 는 여기서 쓰지 않는다.
  # KEDA 가 경고를 준다: 이 둘은 minReplicaCount=0(스케일 투 제로)일 때만 의미가 있다.
  # minReplicaCount>=1 이면 스케일 판단을 표준 HPA 가 하므로 아래 behavior 가 실제 제어점이다.
  #
  # 스케일 투 제로를 실험해보고 싶으면 minReplicaCount 를 0 으로 바꾸고
  # pollingInterval/cooldownPeriod 를 되살리면 된다. 대신 첫 메시지는 파드 기동(~60초)을 기다린다.

  # ⚠️ maxReplicaCount 는 토픽 파티션 수(12)를 절대 넘기지 말 것.
  # 넘겨봐야 남는 파드는 할당받을 파티션이 없어 그냥 논다.
  # 이게 Kafka 컨슈머 오토스케일의 진짜 상한이다.
  minReplicaCount: 1
  maxReplicaCount: 12

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # 랙이 잠깐 빠졌다고 바로 줄이면 파드가 계속 뜨고 죽는다.
          # 축소는 특히 비싸다 — 축소할 때마다 컨슈머 그룹 리밸런스가 돌고,
          # 리밸런스 중에는 그룹 전체가 잠시 멈춘다.
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30

  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-0.kafka.alimi.svc.cluster.local:9092
        consumerGroup: alimi-checker
        topic: stock.check.requested.v1
        # 파드 1개당 감당할 랙. 낮을수록 공격적으로 늘어난다.
        # 체크 1건이 ~10초 걸리므로 5면 "약 50초치 밀렸을 때 1대 추가"라는 뜻.
        lagThreshold: "5"
        offsetResetPolicy: earliest
