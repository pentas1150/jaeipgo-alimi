# k8s 배포 시 (SPRING_PROFILES_ACTIVE=k8s).
# 접속 정보는 ConfigMap/Secret 이 환경변수로 주입한다.
spring:
  flyway:
    # ⚠️ 앱은 마이그레이션을 돌리지 않는다.
    #
    # 이유: 배포 단위가 4개이고 api 는 replicas=2 라, 켜두면 여러 파드가 동시에
    # 마이그레이션을 시도한다. Flyway 가 락을 잡아 안전하긴 하지만,
    # 롤링 배포 중에 **구버전 파드가 살아있는 상태로 스키마가 바뀔 수 있다.**
    #
    # 대신 k8s/base/migration-job.yaml 이 배포 전에 단 한 번 실행한다.
    # 스키마가 없으면 JPA ddl-auto=validate 가 기동을 실패시키므로,
    # Job 이 끝날 때까지 앱은 CrashLoop 하다가 자동으로 회복된다.
    enabled: false
  # SMTP 접속 정보는 Secret 으로 주입한다 (k8s/base/config.yaml).
  # transport 를 smtp 로 바꾸기 전까지는 로그 전용 어댑터가 뜬다.
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 타임아웃이 없으면 SMTP 가 응답을 안 줄 때 컨슈머 스레드가 영영 묶인다.
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000


logging:
  level:
    com.jaeipgo.alimi: INFO

