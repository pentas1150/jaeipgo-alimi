name: CD

# main 에 푸시되면 라즈베리파이4(arm64, k3s)에 무중단 배포한다.
#
# 빌드를 두 러너로 나눈 이유: 파이4(4GB)에서 Kotlin 6모듈을 컴파일하면 MySQL/Kafka/JVM 과
# 같은 메모리를 다툰다. jar 는 아키텍처 무관하므로 **컴파일은 호스티드 러너**가 하고,
# 파이는 COPY 뿐인 얇은 이미지 조립과 배포만 한다.
#
# ⚠️ self-hosted 러너에는 절대 pull_request 트리거를 붙이지 않는다.
#    포크가 보낸 코드가 집 안 네트워크의 파이에서 실행된다.
on:
  push:
    branches: [main]
    # 문서만 바뀐 푸시로 20분짜리 배포를 돌리지 않는다.
    # (배포에 영향을 주는 파일은 여기 넣지 말 것 — k8s/, Dockerfile, backend/ 등)
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      rollback_to:
        description: '롤백할 이미지 태그(커밋 SHA 12자리). 비우면 현재 커밋으로 일반 배포.'
        required: false
        type: string

# 배포는 절대 중간에 취소하지 않는다. 취소하면 마이그레이션과 롤아웃 사이에서 멈춘다.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  build:
    name: 산출물 빌드 (호스티드)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 롤백은 이미 파이에 있는 이미지를 다시 가리키는 것이므로 빌드가 필요 없다.
    if: ${{ !inputs.rollback_to }}
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - run: ./gradlew :backend:app-checker:installChromium --no-daemon

      # 테스트를 포함해서 돌린다. CD 가 스스로 게이트가 된다 —
      # 통과하지 못한 산출물은 파이에 닿지 않는다.
      - name: 빌드 + 테스트
        run: ./gradlew build --no-daemon

      # Boot 레이어로 미리 분해해 둔다. 파이에서 JVM 을 돌리지 않기 위해서다.
      # (Dockerfile 의 prebuilt 스테이지가 이 디렉터리 구조를 그대로 읽는다)
      - name: bootJar 레이어 분해
        run: |
          for m in app-api app-scheduler app-checker app-notifier; do
            mkdir -p "dist/extracted/$m"
            (cd "dist/extracted/$m" && \
              java -Djarmode=layertools -jar "$GITHUB_WORKSPACE/backend/$m/build/libs/app.jar" extract)
          done

      - name: 프론트엔드 정적 빌드
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 프론트엔드 산출물 수집
        run: |
          mkdir -p dist/frontend
          cp -r frontend/dist/. dist/frontend/

      # ⚠️ tar 로 묶어서 올린다. actions/upload-artifact 는 **빈 디렉터리를 담지 않는데**,
      # layertools 가 만드는 snapshot-dependencies/ 는 SNAPSHOT 의존성이 없으면 비어 있다.
      # 그대로 올리면 파이에서 그 디렉터리만 사라져 COPY 가 "not found" 로 죽는다.
      # 부수 효과로 수천 개 작은 jar 를 파일 단위로 전송하지 않게 되어 왕복이 빨라진다.
      - name: 산출물 묶기
        run: tar -czf dist.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tar.gz
          retention-days: 3
          # 이미 gzip 이다. 다시 압축해봐야 시간만 쓴다.
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/*/build/reports/tests/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  manifests:
    name: 매니페스트 검증 (호스티드)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUSTOMIZE_VERSION: '5.5.0'
      KUBECONFORM_VERSION: '0.6.7'
    steps:
      - uses: actions/checkout@v4

      - name: Secret 이 커밋되지 않았는지
        run: |
          if git ls-files --error-unmatch k8s/base/secret.env 2>/dev/null; then
            echo "::error::k8s/base/secret.env 가 추적되고 있다. 즉시 제거할 것."
            exit 1
          fi

      - name: 도구 설치
        run: |
          curl -sSLo /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          sudo tar -xzf /tmp/kustomize.tar.gz   -C /usr/local/bin kustomize
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      # 파이에 apply 되기 전에 여기서 깨진다. self-hosted 러너를 헛돌리지 않는다.
      - name: base + pi 오버레이 검증
        run: |
          cp k8s/base/secret.env.example k8s/base/secret.env
          kustomize build k8s/base           | kubeconform -strict -summary -
          kustomize build k8s/overlays/pi    | kubeconform -strict -summary -

      - name: KEDA CRD 검증 (kind 전용 경로)
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s/keda/

  # ────────────────────────────────────────────────────────────────
  deploy:
    name: 배포 (라즈베리파이 k3s)
    runs-on: [self-hosted, linux, ARM64, alimi-pi]
    # 첫 배포는 Playwright 베이스(6.4GB)를 처음 받느라 이미지 빌드에만 20분 넘게 쓴다.
    # 거기에 MySQL 최초 초기화(microSD 에서 느리다)까지 겹쳐 30분으로는 모자랐다.
    # 베이스가 캐시된 뒤로는 5~10분이면 끝나지만, 상한은 첫 배포 기준으로 잡는다.
    timeout-minutes: 90
    needs: [build, manifests]
    # rollback_to 로 수동 실행하면 build 가 skip 되므로 always() 로 받아준다.
    if: ${{ always() && needs.manifests.result == 'success' && (needs.build.result == 'success' || inputs.rollback_to) }}
    steps:
      - uses: actions/checkout@v4

      - name: 배포 태그 결정
        id: tag
        run: |
          if [ -n "${{ inputs.rollback_to }}" ]; then
            echo "value=${{ inputs.rollback_to }}" >> "$GITHUB_OUTPUT"
            echo "mode=rollback"                   >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "mode=deploy"             >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tag.outputs.mode == 'deploy'
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: 산출물 펼치기
        if: steps.tag.outputs.mode == 'deploy'
        run: |
          mkdir -p dist
          tar -xzf dist.tar.gz -C dist
          rm -f dist.tar.gz
          # 네 모듈 모두 레이어 4종이 있어야 한다. 없으면 여기서 잡는다.
          for m in app-api app-scheduler app-checker app-notifier; do
            for l in dependencies spring-boot-loader snapshot-dependencies application; do
              [ -d "dist/extracted/$m/$l" ] \
                || { echo "::error::dist/extracted/$m/$l 이 없다"; exit 1; }
            done
          done
          [ -f dist/frontend/index.html ] || { echo "::error::dist/frontend 가 비었다"; exit 1; }
          echo "산출물 확인 완료"

      # secret.env 는 리포지토리에 없다. 배포 때만 만들고 끝나면 지운다.
      - name: Secret 파일 생성
        env:
          ALIMI_SECRET_ENV: ${{ secrets.ALIMI_SECRET_ENV }}
        run: |
          umask 077
          printf '%s\n' "$ALIMI_SECRET_ENV" > k8s/base/secret.env
          # secret 이 비었으면 printf 가 개행 1바이트를 남기므로 `test -s` 로는 안 걸린다.
          # 반드시 있어야 하는 키로 확인한다.
          for k in MYSQL_ROOT_PASSWORD MYSQL_DATABASE MYSQL_USER MYSQL_PASSWORD; do
            grep -q "^${k}=" k8s/base/secret.env \
              || { echo "::error::secrets.ALIMI_SECRET_ENV 에 ${k} 가 없다"; exit 1; }
          done

      # 전부 COPY 뿐이라 수 초에 끝난다. buildkit 이 k3s containerd(k8s.io 네임스페이스)에
      # 직접 굽기 때문에 docker save → ctr import 로 microSD 를 갈아먹지 않는다.
      - name: 디스크 여유 확인
        if: steps.tag.outputs.mode == 'deploy'
        run: |
          set -euo pipefail
          df -h /
          avail_mb=$(df -Pm / | awk 'NR==2 {print $4}')
          # checker 이미지만 6.4GB 다. 빌드 도중에 차면 원인이 한참 안 보인다.
          if [ "$avail_mb" -lt 3072 ]; then
            echo "여유 ${avail_mb}MB — buildkit 캐시부터 정리한다"
            sudo nerdctl --address /run/k3s/containerd/containerd.sock \
              builder prune --force --keep-storage 2GB || true
            df -h /
            avail_mb=$(df -Pm / | awk 'NR==2 {print $4}')
            [ "$avail_mb" -ge 2048 ] \
              || { echo "::error::디스크 여유 ${avail_mb}MB. scripts/prune-images.sh 로 정리 필요"; exit 1; }
          fi

      - name: 이미지 빌드 (containerd 에 직접)
        if: steps.tag.outputs.mode == 'deploy'
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          # ⚠️ --address 를 반드시 준다. nerdctl 의 기본 소켓은
          #    /run/containerd/containerd.sock 인데 k3s 는 /run/k3s/... 를 쓴다.
          #    --namespace 만 주면 "cannot access containerd socket" 으로 죽는다.
          SOCK=/run/k3s/containerd/containerd.sock
          build() { sudo nerdctl --address "$SOCK" --namespace k8s.io build --progress plain "$@" . ; }
          for m in api scheduler notifier; do
            build --target runtime \
                  --build-arg LAYERS_FROM=prebuilt --build-arg MODULE="app-$m" \
                  -t "alimi-$m:$TAG"
          done
          build --target runtime-playwright --build-arg LAYERS_FROM=prebuilt -t "alimi-checker:$TAG"
          build --target migration                                          -t "alimi-migration:$TAG"
          build --target frontend --build-arg FRONTEND_FROM=frontend-prebuilt -t "alimi-frontend:$TAG"

      - name: 매니페스트 렌더 (이미지 태그 고정)
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          cd k8s/overlays/pi
          for r in api scheduler notifier checker frontend migration; do
            kustomize edit set image "alimi-$r=alimi-$r:$TAG"
          done
          cd -
          kustomize build k8s/overlays/pi > /tmp/alimi-rendered.yaml
          grep -E '^\s+image: alimi-' /tmp/alimi-rendered.yaml | sort -u

      # ── 1단계: 인프라 + 스키마. 앱보다 먼저 끝나야 한다. ──────────────
      # 순서를 강제하지 않으면 새 파드가 ddl-auto=validate 로 CrashLoop 하다가
      # progressDeadlineSeconds(600s)에 걸려 배포가 실패로 뒤집힌다.
      - name: 1단계 — 인프라 + 마이그레이션
        run: |
          set -euo pipefail

          # ⚠️ 반드시 apply 보다 **먼저** 지운다.
          # Job 의 spec.template 은 immutable 이라, 이미지 태그가 바뀐 Job 을 apply 하면
          #   The Job "alimi-migration" is invalid: spec.template: ... field is immutable
          # 으로 죽는다. 그리고 이 Job 은 아래 apply 에 포함돼 있으므로,
          # 삭제를 별도 스텝으로 미루면 apply 가 먼저 터진다.
          kubectl -n alimi delete job alimi-migration --ignore-not-found --wait=true

          kubectl apply -f /tmp/alimi-rendered.yaml -l alimi.stage=infra

          # MySQL 최초 초기화까지 기다려야 할 수 있다(microSD 에서 느리다).
          # Flyway 자체도 -connectRetries=30 으로 브로커를 기다린다.
          kubectl -n alimi wait --for=condition=complete job/alimi-migration --timeout=900s || {
            echo "::group::migration job"
            kubectl -n alimi describe job alimi-migration || true
            kubectl -n alimi logs job/alimi-migration --tail=100 || true
            echo "::endgroup::"
            echo "::group::infra pods"
            kubectl -n alimi get pods -o wide || true
            kubectl -n alimi logs sts/mysql --tail=30 || true
            echo "::endgroup::"
            exit 1
          }

      # ⚠️ 앱을 올리기 전에 인프라가 실제로 Ready 인지 확인한다.
      #
      # application.yml 의 spring.kafka.admin.fail-fast: true 때문에 브로커가 없으면
      # 앱 4개가 전부 기동에 실패한다(DESIGN §12.6 ④). 이 게이트가 없으면 그 사실이
      # "rollout status 가 600초 뒤 타임아웃" 이라는 애매한 형태로만 드러난다.
      # ⚠️ StatefulSet 은 파드가 Ready 가 아니면 롤링 업데이트를 진행하지 않는다.
      # 그래서 "프로브가 틀려서 Ready 가 안 되는" 상황에서는 그 프로브 수정이
      # 영원히 적용되지 않는 교착이 생긴다 — 실제로 겪었다. kafka-0 이 78분간
      # 옛 프로브로 돌면서 x478 회 실패했고, 새 템플릿은 적용되지 못했다.
      # (쿠버네티스 문서의 "forced rollback" 이 다루는 상황이다)
      #
      # 파드의 controller-revision-hash 가 StatefulSet 의 updateRevision 과
      # 다르면 옛 리비전에 갇힌 것이므로 지워서 재생성시킨다.
      - name: 인프라 파드 리비전 동기화
        run: |
          set -euo pipefail
          sync() {
            local sts="$1" pod="$2" want have
            want="$(kubectl -n alimi get sts "$sts" -o jsonpath='{.status.updateRevision}' 2>/dev/null || true)"
            have="$(kubectl -n alimi get pod "$pod" -o jsonpath='{.metadata.labels.controller-revision-hash}' 2>/dev/null || true)"
            if [ -n "$want" ] && [ -n "$have" ] && [ "$want" != "$have" ]; then
              echo "  $pod: 옛 리비전 $have → 삭제하고 $want 로 재생성"
              kubectl -n alimi delete pod "$pod" --wait=true --timeout=120s
            else
              echo "  $pod: 최신 리비전 ($have)"
            fi
          }
          sync kafka kafka-0
          sync mysql mysql-0

      - name: 인프라 Ready 확인
        run: |
          set -euo pipefail
          fail() {
            echo "::group::$1 진단"
            kubectl -n alimi describe pod "$1" | sed -n '/^Events:/,$p' || true
            kubectl -n alimi logs "$1" --tail=60 || true
            echo "::endgroup::"
            exit 1
          }
          kubectl -n alimi wait --for=condition=ready pod/mysql-0 --timeout=300s || fail mysql-0
          kubectl -n alimi wait --for=condition=ready pod/kafka-0 --timeout=300s || fail kafka-0
          # Ingress 입구. 이게 없으면 스모크가 "connection refused" 로만 실패해 원인이 안 보인다.
          kubectl -n kube-system rollout status deploy/traefik --timeout=180s
          echo "mysql-0 / kafka-0 / traefik Ready"

      # ── 2단계: 앱 롤링 업데이트 ────────────────────────────────────
      - name: 2단계 — 앱 배포
        run: |
          set -euo pipefail
          kubectl apply -f /tmp/alimi-rendered.yaml
          rc=0
          for d in alimi-api alimi-frontend alimi-scheduler alimi-notifier alimi-checker; do
            kubectl -n alimi rollout status "deploy/$d" --timeout=420s || { rc=1; break; }
          done
          if [ "$rc" -ne 0 ]; then
            # 왜 안 떴는지 한 번에 보여준다. 배포 1회가 20분이라 왕복을 줄여야 한다.
            echo "::group::파드 상태"
            kubectl -n alimi get pods -o wide
            echo "::endgroup::"
            echo "::group::Pending / 실패 파드 이벤트"
            kubectl -n alimi get pods --no-headers \
              | awk '$3!="Running" && $3!="Completed" {print $1}' \
              | while read -r pod; do
                  echo "--- $pod"
                  kubectl -n alimi describe pod "$pod" | sed -n '/^Events:/,$p' | tail -15
                  kubectl -n alimi logs "$pod" --tail=40 --all-containers 2>/dev/null || true
                done
            echo "::endgroup::"
            echo "::group::노드 자원"
            kubectl describe node | sed -n '/Allocated resources/,/Events/p' | head -14
            echo "::endgroup::"
            exit 1
          fi

      - name: 스모크 테스트
        run: |
          set -euo pipefail
          ing="$(kubectl -n alimi get ingress alimi -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          : "${ing:=127.0.0.1}"

          # ① Traefik → Service → nginx
          curl -fsS --retry 5 --retry-delay 3 "http://${ing}/healthz" | grep -q ok
          echo "  ① Ingress → frontend OK"

          # ② api 자체의 health.
          # ⚠️ Ingress 로는 확인할 수 없다. nginx 의 `location /api/` 는 proxy_pass 에
          # 경로가 없어 **원본 URI 를 그대로** 넘기는데, actuator 는 /actuator/** 에 있고
          # 컨트롤러만 /api/** 에 있다. 즉 /api/actuator/health 는 앱에서 404 다.
          # 클러스터 안에서 직접 친다(부수적으로 Service DNS 도 검증된다).
          kubectl -n alimi exec deploy/alimi-frontend -- \
            wget -q -O - -T 10 http://alimi-api:8080/actuator/health | grep -q '"status":"UP"'
          echo "  ② api /actuator/health UP"

          # ③ nginx → api 프록시 경로가 실제로 살아 있는지.
          # `location /api/` 는 모든 /api/* 를 앱으로 넘기므로, 4xx 든 2xx 든
          # **앱이 응답했다는 뜻**이다. 프록시가 끊겼을 때만 502/503/504/000 이 나온다.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${ing}/api/notifications/0")"
          case "$code" in
            502|503|504|000) echo "::error::nginx → api 프록시 실패 (HTTP $code)"; exit 1 ;;
            *)               echo "  ③ /api/ 프록시 OK (HTTP $code — 앱이 응답)" ;;
          esac

          # ④ 도메인 + TLS 진입. 구글 OAuth 가 https 리다이렉트 URI 를 요구하므로
          #    이 경로가 살아 있어야 로그인이 된다.
          #
          #    --resolve 로 DNS 를 우회한다. 러너가 집 안(파이)에서 도는데, 공유기가
          #    NAT 헤어핀을 지원하지 않으면 내부에서 공인 IP 로 못 붙어 멀쩡한 배포가
          #    실패로 보인다. Ingress IP 를 직접 물려 TLS/SNI/host 규칙만 검증한다.
          #
          #    인증서 부트스트랩(cert-renew CronJob 최초 1회) 전에는 Traefik 이 자체서명
          #    기본 인증서를 내주므로 검증이 실패한다. 그건 배포 실패가 아니라 아직
          #    설정 안 된 상태이므로 경고로만 남기고 넘어간다.
          host="$(kubectl -n alimi get ingress alimi-domain -o jsonpath='{.spec.rules[0].host}' 2>/dev/null || true)"
          if [ -z "$host" ]; then
            echo "  ④ 도메인 Ingress 없음 — 건너뜀"
          elif ! kubectl -n alimi get secret alimi-tls >/dev/null 2>&1; then
            echo "::warning::alimi-tls Secret 이 없다. 인증서 부트스트랩 전이므로 https 검증을 건너뛴다 (k8s/pi/README.md §6.1)"
          elif curl -fsS --max-time 10 --resolve "${host}:443:${ing}" "https://${host}/healthz" | grep -q ok; then
            echo "  ④ https://${host} TLS 진입 OK"
          else
            echo "::error::https://${host} 진입 실패 — 인증서 또는 Ingress host 설정을 확인하라"
            kubectl -n alimi get secret alimi-tls -o jsonpath='{.metadata.creationTimestamp}' || true
            exit 1
          fi

          echo "스모크 통과"

      # 롤아웃이나 스모크가 실패하면 직전 ReplicaSet 으로 되돌린다.
      # 이전 SHA 이미지는 prune 스크립트가 KEEP 개까지 보존하므로 노드에 남아 있다.
      - name: 실패 시 롤백
        if: failure()
        run: |
          for d in alimi-api alimi-frontend alimi-scheduler alimi-notifier alimi-checker; do
            # 아직 만들어진 적 없는 Deployment 에 undo 를 때리면 에러만 쌓여
            # 진짜 실패 원인이 로그에 묻힌다.
            kubectl -n alimi get "deploy/$d" >/dev/null 2>&1 || continue
            # 되돌아갈 리비전이 1개뿐이면(첫 배포) undo 는 의미가 없다.
            revs=$(kubectl -n alimi rollout history "deploy/$d" 2>/dev/null | grep -c '^[0-9]' || echo 0)
            [ "$revs" -ge 2 ] && kubectl -n alimi rollout undo "deploy/$d" || echo "  $d: 되돌릴 이전 리비전 없음"
          done
          kubectl -n alimi get pods -o wide
          echo "::error::배포 실패 — 직전 버전으로 되돌렸다. 스키마는 되돌아가지 않는다(Flyway 에 down 이 없다)."

      - name: 이미지 정리
        if: always() && steps.tag.outputs.mode == 'deploy'
        env:
          # 디스크가 이미 75% 다(29G 중 21G). 롤백 여지를 남기되 보수적으로 잡는다.
          KEEP: '3'
        run: ./scripts/prune-images.sh "${{ steps.tag.outputs.value }}"

      - name: 작업 파일 삭제
        if: always()
        run: |
          shred -u k8s/base/secret.env 2>/dev/null || rm -f k8s/base/secret.env
          rm -rf dist dist.tar.gz /tmp/alimi-rendered.yaml
