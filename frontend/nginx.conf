server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 정적 자산. Vite 가 파일명에 해시를 넣으므로 길게 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 는 같은 오리진으로 프록시한다 → CORS 설정이 통째로 불필요해진다.
    # 이것이 프론트를 nginx 로 서빙하는 실질적인 이득 중 하나다.
    location /api/ {
        proxy_pass http://alimi-api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx 자신의 헬스체크. 백엔드와 무관하게 응답해야 한다.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # SPA 라우팅: 없는 경로는 index.html 로 넘긴다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
