<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재입고 알리미</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>재입고 알리미</h1>
      <p class="sub">네이버 스마트스토어 품절 상품이 다시 들어오면 알려드립니다.</p>

      <form id="watch-form">
        <label for="url">상품 URL</label>
        <input id="url" name="url" type="url" required
               placeholder="https://smartstore.naver.com/{스토어}/products/{번호}" />

        <label for="target">알림 받을 곳</label>
        <input id="target" name="target" type="text" required
               placeholder="이메일 주소 또는 웹훅 URL" />

        <button type="submit">알림 신청</button>
      </form>

      <p id="result" class="result" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
