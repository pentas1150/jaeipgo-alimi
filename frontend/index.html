<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재입고 알리미</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <h1>재입고 알리미</h1>
        <!-- 로그인 상태가 확정되기 전에는 아무것도 보이지 않는다.
             버튼이 깜빡였다 바뀌는 것보다 잠깐 비어 있는 편이 낫다. -->
        <div id="account" class="account" hidden></div>
      </header>

      <p class="sub">네이버 스마트스토어 품절 상품이 다시 들어오면 알려드립니다.</p>

      <!-- 로그아웃 상태 -->
      <section id="signed-out" hidden>
        <p class="sub">알림을 받으려면 먼저 로그인하세요. 알림은 로그인한 구글 계정 이메일로 갑니다.</p>
        <a class="btn" href="/api/oauth2/authorization/google">구글로 계속하기</a>
      </section>

      <!-- 로그인 상태 -->
      <form id="watch-form" hidden>
        <label for="url">상품 URL</label>
        <input id="url" name="url" type="url" required
               placeholder="https://smartstore.naver.com/{스토어}/products/{번호}" />

        <button type="submit">알림 신청</button>
      </form>

      <p id="result" class="result" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
