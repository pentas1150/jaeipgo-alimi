name: jaeipgo-alimi

services:
  mysql:
    image: mysql:8.4
    container_name: alimi-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alimi}
      MYSQL_USER: ${MYSQL_USER:-alimi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-alimi}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: alimi-kafka
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: alimi-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    profiles: ["tools"]

  # ── 앱 4종 + 프론트 ────────────────────────────────────────────
  # 모듈이 곧 배포 단위다. 프로파일은 이제 환경(docker)만 의미한다.
  # (역할은 프로파일이 아니라 모듈이 나눈다 — docs/DESIGN.md §10.2)

  migration:
    build: { context: ., dockerfile: Dockerfile, target: migration }
    container_name: alimi-migration
    depends_on:
      mysql: { condition: service_healthy }
    command:
      - -url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-alimi}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      - -user=${MYSQL_USER:-alimi}
      - -password=${MYSQL_PASSWORD:-alimi}
      - -connectRetries=30
      - -baselineOnMigrate=true
      - migrate
    profiles: ["app"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args: { MODULE: app-api }
    container_name: alimi-api
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migration: { condition: service_completed_successfully }
    ports:
      - "${APP_PORT:-8080}:8080"
    environment: &app-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-alimi}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-alimi}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-alimi}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # compose 에서는 앱이 마이그레이션을 돌리지 않는다 (migration 서비스가 담당)
      SPRING_FLYWAY_ENABLED: "false"
    profiles: ["app"]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args: { MODULE: app-scheduler }
    container_name: alimi-scheduler
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migration: { condition: service_completed_successfully }
    environment: *app-env
    profiles: ["app"]

  checker:
    build: { context: ., dockerfile: Dockerfile, target: runtime-playwright }
    container_name: alimi-checker
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migration: { condition: service_completed_successfully }
    # ⚠️ 기본 64MB 로는 Chromium 이 랜덤하게 죽는다. k8s 의 emptyDir{medium:Memory} 와 같은 역할.
    shm_size: 1gb
    environment:
      <<: *app-env
      SPRING_KAFKA_CONSUMER_GROUP_ID: alimi-checker
    profiles: ["app"]

  notifier:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args: { MODULE: app-notifier }
    container_name: alimi-notifier
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migration: { condition: service_completed_successfully }
    environment:
      <<: *app-env
      SPRING_KAFKA_CONSUMER_GROUP_ID: alimi-notifier
    profiles: ["app"]

  frontend:
    build: { context: ., dockerfile: Dockerfile, target: frontend }
    container_name: alimi-frontend
    depends_on: [api]
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    profiles: ["app"]

volumes:
  mysql-data:
